spring:
  application:
    name: dpap-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dpap}
    username: ${DB_USER:dpap}
    password: ${DB_PASSWORD:dpap}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  servlet:
    # The frontend's NEXT_PUBLIC_API_BASE_URL points at ".../api".
    context-path: /api
  port: ${PORT:8080}

app:
  jwt:
    # Override in every non-dev environment. Base64 or plain; must be >= 32 bytes.
    secret: ${JWT_SECRET:dev-insecure-jwt-secret-change-me-at-least-32-bytes}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:28800} # 8h
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    # Host/port wildcard patterns accepted in addition to the exact origins, so
    # the apps can be reached over a LAN IP/hostname (phones/tablets, field
    # servers) without pinning the address. Private ranges by default; override
    # with CORS_ALLOWED_ORIGIN_PATTERNS (empty string disables).
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://192.168.*:*,http://10.*:*,http://172.*:*,http://*.local:*}
  attachments:
    # Where submission photos are stored. Mount a persistent volume in production.
    dir: ${ATTACHMENTS_DIR:/tmp/dpap-attachments}
  seed:
    # Seed demo users + sample actors on startup when the tables are empty.
    demo-data: ${SEED_DEMO_DATA:true}
    demo-password: ${SEED_DEMO_PASSWORD:dpap2024}

management:
  endpoints:
    web:
      exposure:
        include: health,info
